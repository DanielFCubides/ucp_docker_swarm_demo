apiVersion: v1
kind: Service
metadata:
  labels:
    app: rest-proxy
  name: rest-proxy
  namespace: default
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - nodePort: 30000
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: rest-proxy
  sessionAffinity: None
  type: NodePort
status:
  loadBalancer: {}