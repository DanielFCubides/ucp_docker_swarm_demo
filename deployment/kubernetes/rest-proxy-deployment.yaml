apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rest-proxy
  name: rest-proxy
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      app: rest-proxy
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: rest-proxy
    spec:
      containers:
      - image: rest-proxy:production
        imagePullPolicy: IfNotPresent
        name: rest-proxy
        ports:
        - containerPort: 8000
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: rest-proxy
  name: rest-proxy
  namespace: default
spec:
  clusterIP: 10.105.63.6
  clusterIPs:
  - 10.105.63.6
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - nodePort: 30000
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: rest-proxy
  sessionAffinity: None
  type: NodePort
status:
  loadBalancer: {}
